[package]
name = "cartoonnotebook"
version = "0.1.0"
description = "动漫档案馆"
edition = "2021"
rust-version = "1.77"
# 有两个 bin（应用本身与 devserver），告诉 cargo run 默认跑哪个
default-run = "cartoonnotebook"

[lib]
name = "cartoonnotebook_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cartoonnotebook"
path = "src/main.rs"

[[bin]]
name = "devserver"
path = "src/bin/devserver.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
tower = { version = "0.5", features = ["util"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rust-embed = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }

# 调试信息降到 1 级：保留行号，内存占用小一半，这台机器内存紧张时编译不会被 OOM 杀掉
[profile.dev]
debug = 1

[profile.release]
opt-level = "s"
# 这台机器内存紧张：fat/thin LTO 的链接峰值会 OOM，牺牲一点体积换稳定
lto = false
codegen-units = 16
strip = true
